services:
  postgres:
    image: postgres:17-alpine
    container_name: assignment_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: my_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assignment_backend
    restart: always
    tty: true
    stdin_open: true
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Information
      - ConnectionStrings__DefaultConnection=Host=assignment_postgres;Port=5432;Database=mydb;Username=postgres;Password=mysecretpassword
      - JwtSettings__Issuer=AssignmentManager.API
      - JwtSettings__Audience=AssignmentManager.UI
      - JwtSettings__PrivateKey=-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----
      - JwtSettings__PublicKey=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    container_name: assignment_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmin-data: